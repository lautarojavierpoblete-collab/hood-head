
<main class="store">
  <header class="topbar">
    <a class="brand" href="/" aria-label="HOOD HEAD, inicio">
      HOOD<span>HEAD</span>
    </a>

    <span class="tagline">UNDERGROUND STREETWEAR</span>
  </header>

  <section class="hero">
    <p class="eyebrow">NO RULES. YOUR STYLE.</p>

    <h1>
      VESTÍ TU<br />
      <span>IDENTIDAD.</span>
    </h1>

    <p class="description">
      Una nueva forma de expresar quién sos.
      HOOD HEAD está en construcción.
    </p>

    <div
      class="connection"
      [class.connection--ok]="conectado()"
      [class.connection--error]="!conectado() && estado() !== 'Conectando con el backend...'"
    >
      <span class="status-dot"></span>
      <div>
        <strong>Estado del sistema</strong>
        <p>{{ estado() }}</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span>HOOD HEAD © 2026</span>
    <span>BUILT FROM ZERO.</span>
  </footer>
</main>

<router-outlet />
